<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <section id="now" class="player">
    <div class="player-track">
      <div class="player-cover"><img id="now-cover" alt="" hidden></div>
      <div class="player-text">
        <div id="now-title" class="player-title"></div>
        <div id="now-artist" class="player-artist"></div>
      </div>
    </div>
    <div class="player-controls">
      <button class="ctrl" data-action="prev" title="Предыдущий трек">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg>
      </button>
      <button id="toggle" class="ctrl toggle" data-action="toggle" title="Пауза">
        <svg id="now-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
      <button class="ctrl" data-action="next" title="Следующий трек">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5H18v14h-2.5zM4 5v14l10.5-7z"/></svg>
      </button>
      <button id="pip" class="pip tip" aria-pressed="false" data-tip="Показывать на всех сайтах" aria-label="Показывать виджет на всех сайтах">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="6" height="5" rx="1" class="pip-inner"/></svg>
      </button>
    </div>
  </section>
  <div id="now-sep" class="sep"></div>

  <header class="head">
    <div id="head-lobby" class="title">
      <span>babushkin-jam</span>
      <span id="badge" class="badge" hidden>local</span>
    </div>
    <div id="head-room" class="room-head" hidden>
      <div class="status"><span id="room-dot" class="dot"></span><span id="role"></span></div>
    </div>
    <div id="head-settings" class="title" hidden>Настройки</div>
    <div class="head-btns">
      <button id="widget" class="icon-btn" title="Показать виджет">
        <svg class="icon-shown" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="icon-hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
      <button id="settings-btn" class="icon-btn" title="Настройки" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button id="tools" class="icon-btn" title="Инструменты" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
      </button>
    </div>
  </header>

  <div id="menu" class="menu" role="menu" hidden>
    <button id="resync" class="menu-item" role="menuitem">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>
      <span id="resync-label">Синхронизировать</span>
    </button>
    <button id="diag" class="menu-item" role="menuitem">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>
      <span id="diag-label">Скопировать диагностику</span>
    </button>
    <div class="menu-sep"></div>
    <dl class="menu-stats">
      <dt>сервер</dt><dd id="m-server">—</dd>
      <dt>пинг</dt><dd id="m-ping">—</dd>
      <dt>расхождение</dt><dd id="m-drift">—</dd>
      <dt>версия</dt><dd id="m-version">—</dd>
    </dl>
  </div>

  <main id="setup" class="stack">
    <label class="field">
      <span class="label">Ваше имя</span>
      <input id="name" class="input" maxlength="40" placeholder="Гость" autocomplete="off">
    </label>

    <div id="server-box" class="field" hidden>
      <div class="label-row"><span class="label">Сервер</span><button id="server-hide" class="dashed">Скрыть</button></div>
      <input id="server" class="input input-mono fade" spellcheck="false" autocomplete="off">
      <div class="hint">Оставьте пустым — подключимся к общему серверу.</div>
    </div>

    <div class="create">
      <button id="create" class="btn-primary">Создать комнату</button>
      <div id="server-line" class="server-line">
        <div class="status"><span id="srv-dot" class="dot"></span><span id="srv-text"></span></div>
        <button id="server-show" class="dashed">Свой сервер</button>
      </div>
    </div>

    <div class="sep"></div>

    <div class="field">
      <span class="label">Есть код от друга?</span>
      <div class="row">
        <input id="code" class="input input-mono code-input" maxlength="12" placeholder="КОД" spellcheck="false" autocomplete="off">
        <button id="join" class="btn-secondary">Войти</button>
      </div>
    </div>

    <div id="no-tab-lobby" class="warning" hidden></div>
    <p class="disclaimer">Неофициальное расширение, не связано с Яндексом.</p>
  </main>

  <main id="inroom" class="stack" hidden>
    <section class="people">
      <div class="people-row">
        <div id="people-title" class="label people-title"></div>
        <button id="room-code" class="code-copy" title="Скопировать код комнаты"></button>
      </div>
      <ul id="members" class="members"></ul>
      <div id="alone" class="alone" hidden>Пока только вы. Отправьте ссылку — друг появится здесь.</div>
    </section>

    <div class="share">
      <button id="copy" class="btn-primary btn-icon">
        <svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <svg class="icon-done" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span id="copy-label">Скопировать ссылку</span>
      </button>
      <div id="invite-link" class="invite-link"></div>
    </div>

    <div id="warning" class="warning" hidden></div>
    <button id="leave" class="btn-outline">Выйти из комнаты</button>
  </main>

  <main id="settings" class="stack" hidden>
    <div class="field">
      <span class="label">Ваше имя</span>
      <div id="s-name" class="name-row"></div>
    </div>
    <div class="field">
      <span class="label">Где показывать виджет</span>
      <div class="seg" role="radiogroup">
        <button id="w-ym" role="radio" aria-checked="true">На Яндекс Музыке</button>
        <button id="w-all" role="radio" aria-checked="false">На всех сайтах</button>
      </div>
      <div id="w-hint" class="hint"></div>
    </div>
    <button id="settings-done" class="btn-outline">Готово</button>
  </main>

  <script src="../src/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
