# Основной домен: HTTPS на 443 принимает nginx сервера и передаёт в Caddy, тот раскладывает по контейнерам.
# На сервере лежит в /etc/nginx/sites-enabled/zz-jam-domain: имя идёт после других сайтов, чтобы не стать сайтом по умолчанию.
# Сертификат: certbot certonly --webroot -w /var/www/html --cert-name {$JAM_DOMAIN} -d {$JAM_DOMAIN} -d sync.{$JAM_DOMAIN} -d share.{$JAM_DOMAIN}
# Для одного адреса без поддоменов уберите sync и share из server_name и из команды certbot.

map $http_upgrade $jam_connection {
    "" "";
    default upgrade;
}

server {
    listen 80;
    server_name {$JAM_DOMAIN} sync.{$JAM_DOMAIN} share.{$JAM_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name {$JAM_DOMAIN} sync.{$JAM_DOMAIN} share.{$JAM_DOMAIN};

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/{$JAM_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{$JAM_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jam_connection;
        # Заменяем, а не дополняем: адрес из запроса клиент может подделать.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Соединение комнаты живёт долго и молчит между сообщениями.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
