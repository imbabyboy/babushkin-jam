<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--HEAD-->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <form id="form" class="search" action="" method="get" role="search">
      <input id="q" class="input" name="q" maxlength="200" placeholder="Вставьте название песни" autocomplete="off" spellcheck="false" aria-label="Название песни">
      <button class="primary" type="submit">Найти</button>
    </form>

    <p id="status" class="status" role="status" hidden></p>

    <section id="result" class="result" hidden>
      <header class="track">
        <img id="cover" class="cover" alt="" hidden>
        <div class="track-text">
          <h1 id="title" class="title"></h1>
          <p id="artist" class="artist"></p>
        </div>
      </header>
      <div class="tg" hidden>
        <svg class="tg-logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#2AABEE"/><path fill="#fff" d="M5.4 11.9l10.8-4.2c.5-.2.9.1.8.9l-1.8 8.6c-.1.6-.5.8-1 .5l-2.8-2.1-1.4 1.3c-.2.2-.3.3-.6.3l.2-2.9 5.2-4.7c.2-.2 0-.3-.3-.1l-6.4 4-2.8-.9c-.6-.2-.6-.6.1-.9z"/></svg>
        <span class="tg-text"><span class="tg-name">Скачать mp3</span><span class="tg-tag">@minusFourDwnldrBot</span></span>
        <a class="tg-button shine" target="_blank" rel="noopener">Открыть</a>
      </div>
      <ul id="services" class="services"></ul>
      <button id="share" class="ghost copy share" type="button"><svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><span class="label">Скопировать ссылку на страницу</span></button>
    </section>
  </main>
  <footer class="footer">Неофициальный сервис, не связан с перечисленными площадками. Музыку не хранит и не скачивает, только ищет ссылки. <a href="https://babushkin-jam.store/privacy">Политика конфиденциальности</a></footer>
  <script src="app.js"></script>
</body>
</html>
