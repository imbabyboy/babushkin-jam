name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Зависимости
        run: npm ci

      - name: Сборка
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: babushkin-jam-${{ matrix.os }}
          path: |
            native/dist/*.dmg
            native/dist/*.exe
          if-no-files-found: error
