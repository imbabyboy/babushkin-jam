name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Синтаксис JS
        run: |
          node desktop/scripts/bundle.js
          for f in server/server.js extension/src/*.js extension/popup/*.js tools/*.js desktop/src/*.js desktop/src/mini/*.js desktop/src/toolbar/*.js desktop/src/settings/*.js desktop/scripts/*.js desktop/generated/*.js desktop/generated/settings/*.js; do node --check "$f"; done
          sh -n tools/build.sh

      - name: manifest.json
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('extension/manifest.json'));
            if (m.manifest_version !== 3) throw new Error('нужен Manifest V3');
            for (const cs of m.content_scripts) for (const f of cs.js) require('fs').accessSync('extension/' + f);
            console.log('babushkin-jam', m.version);
          "

      - name: Сборка zip для магазина
        run: |
          sh tools/build.sh
          unzip -p dist/babushkin-jam.zip manifest.json | node -e "
            const m = JSON.parse(require('fs').readFileSync(0));
            if (m.name !== 'babushkin-jam') throw new Error('в zip имя ' + m.name);
          "

      - name: Зависимости сервера
        run: npm ci
        working-directory: server

      - name: Сервер запускается
        working-directory: server
        run: |
          PORT=8787 node server.js &
          for i in $(seq 1 20); do curl -fsS http://localhost:8787/ && break; sleep 0.5; done
          curl -fsS http://localhost:8787/privacy | grep -q 'политика конфиденциальности'
